# @package _global_
# Generic unweighted, undirected graph generation (no node/edge types).
# Modelled on configs/experiment/coarse_sbm.yaml -- tune once you pick the dataset.
general:
    name : 'generic'
    gpus : 1
    wandb: 'disabled'
    resume: null
    test_only: null
    check_val_every_n_epochs: 50
    sample_every_val: 2
    samples_to_generate: 40
    samples_to_save: 9
    chains_to_save: 1
    final_model_samples_to_generate: 100
    final_model_samples_to_save: 30
    final_model_chains_to_save: 5
train:
    n_epochs: 3000
    batch_size: 32
    save_model: True
model:
    diffusion_steps: 500
    n_layers: 6
    lambda_train: [5, 0]
    extra_features: 'all'

    hidden_mlp_dims: { 'X': 128, 'E': 64, 'y': 128 }

    # dx % n_head == 0
    hidden_dims: { 'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256 }
