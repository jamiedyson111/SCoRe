# @package _global_
# Conditional intra-cluster model D_intra: thousands of small induced subgraphs.
# Many more examples than the coarse-graph run, and each is smaller, so a bigger
# batch and fewer epochs.
general:
    name : 'cluster_lux'
    gpus : 1
    wandb: 'disabled'
    resume: null
    test_only: null
    check_val_every_n_epochs: 20
    sample_every_val: 2
    samples_to_generate: 64
    samples_to_save: 9
    chains_to_save: 1
    final_model_samples_to_generate: 256
    final_model_samples_to_save: 30
    final_model_chains_to_save: 5
train:
    n_epochs: 1000
    batch_size: 64
    save_model: True
model:
    diffusion_steps: 500
    n_layers: 6
    lambda_train: [5, 0]        # [E weight, y weight]. y weight MUST stay 0 --
                                # y is an input condition, never a prediction target.
    extra_features: 'all'

    hidden_mlp_dims: { 'X': 128, 'E': 64, 'y': 128 }

    # dx % n_head == 0
    hidden_dims: { 'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256 }

    # Version 3, method section V A 1) b. Both off by default, so every earlier
    # run and checkpoint behaves exactly as before. scripts/run_transfer.sh
    # switches them on for the *_v3 configurations.
    #   hop_embed_dim   d_h of the hop embedding e_h = MLP_h(h). null = h enters
    #                   y raw. 1 gives c_i = [n, rho_in, k, e_h], 4 dims instead of 10.
    hop_embed_dim: null
    hop_embed_hidden: 32
dataset:
    # Mark the centroid as its own node type: X in R^{n x 2}, [0, 1] for the
    # centroid and [1, 0] otherwise, held fixed during diffusion.
    mark_centroid: False
