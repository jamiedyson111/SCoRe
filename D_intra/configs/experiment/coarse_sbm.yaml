# @package _global_
# ~200 coarse graphs of ~10-33 nodes. Far smaller than the sbm experiment, which
# trains on 44-187 node graphs for 50000 epochs.
general:
    name : 'coarse_sbm'
    gpus : 1
    wandb: 'disabled'          # BlueBEAR compute nodes usually have no outbound network
    resume: null
    test_only: null
    check_val_every_n_epochs: 50
    sample_every_val: 2
    samples_to_generate: 40
    samples_to_save: 9
    chains_to_save: 1
    # generated_samples1.txt is what the spectral evaluation reads later
    final_model_samples_to_generate: 200
    final_model_samples_to_save: 30
    final_model_chains_to_save: 5
train:
    n_epochs: 3000
    batch_size: 32
    save_model: True
model:
    diffusion_steps: 500
    n_layers: 6
    lambda_train: [5, 0]
    # 'all' adds Laplacian eigenvalue features computed from the noisy graph at each
    # step. The target here IS the spectrum, so keep them; at ~25 nodes they are cheap.
    extra_features: 'all'

    hidden_mlp_dims: { 'X': 128, 'E': 64, 'y': 128 }

    # dx % n_head == 0
    hidden_dims: { 'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256 }
